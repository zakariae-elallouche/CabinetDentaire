; Queue Worker pour HZ Dentaire
; Installation : sudo cp deploy/supervisor-dentapp.conf /etc/supervisor/conf.d/dentapp-queue.conf
; Puis : sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start dentapp-queue:*

[program:dentapp-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dentapp/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/dentapp/backend/storage/logs/queue-worker.log
