<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/DentASpace-Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dent A Space - Cabinet Dentaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --card: #ffffff;
        --ink: #0b1a2e;
        --ink-2: #475569;
        --ink-3: #94a3b8;
        --line: #e2e8f0;
        --line-strong: #cbd5e1;
        --xray-bg: #0b1a2e;
        --accent: #57c8cb;
        --accent-2: #0d9488;
        --accent-soft: #f0fffd;
        --gold: #faad14;
        --amber-soft: #fffbe6;
        --rose: #ff4d4f;
        --rose-soft: #fff2f0;
        --success: #52c41a;
        --success-soft: #f6ffed;
        --info: #57c8cb;
        --info-soft: #f0fffd;
        --radius: 8px;
        --radius-sm: 5px;
      }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
      input, textarea, select { font-family: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
